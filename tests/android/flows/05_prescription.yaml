# Read a prescription photo from the gallery.
appId: com.agastyaray.asha
---
- launchApp
- tapOn: "Meds"
# while Asha speaks the fairy rises, and her bubble sits over this part of the page; let her finish first
- extendedWaitUntil:
    notVisible: "Asha is speaking"
    timeout: 30000
- scrollUntilVisible:
    element: "Choose from gallery"
    # centre it, so the fairy and her bubble never sit on top of the button
    centerElement: true
- tapOn: "Choose from gallery"
- waitForAnimationToEnd
- takeScreenshot: 60-gallery-picker
- tapOn:
    point: "18%,30%"
- waitForAnimationToEnd
- takeScreenshot: 61-after-pick
- extendedWaitUntil:
    visible: "Check these names|.*could not be read.*|.*No internet.*|.*rest.*"
    timeout: 60000
- takeScreenshot: 62-prescription-result
- scroll
- takeScreenshot: 63-prescription-result-2
