# Read a prescription photo from the gallery.
appId: com.agastyaray.asha
---
- launchApp
- tapOn: "Meds"
- tapOn: "Choose from gallery"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/60-gallery-picker
- tapOn:
    point: "18%,30%"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/61-after-pick
- extendedWaitUntil:
    visible: "Check these names|.*could not be read.*|.*No internet.*|.*rest.*"
    timeout: 60000
    optional: true
- takeScreenshot: ${OUT}/62-prescription-result
- scroll
- takeScreenshot: ${OUT}/63-prescription-result-2
