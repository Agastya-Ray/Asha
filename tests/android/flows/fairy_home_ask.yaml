# Today: the fairy asks to live on the home screen; "Yes" opens Android's wallpaper preview.
# The card sits near the top of Today; the script scrolls Today to the top first.
# No centring: with the greeting fairy moving below it, Maestro could not settle on a centred position.
appId: com.agastyaray.asha
---
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: "Yes, live on my screen"
    direction: DOWN
    visibilityPercentage: 60
    timeout: 30000
# lift the button above the in-app fairy and her greeting, which sit near the bottom of the screen
- swipe:
    start: "50%,70%"
    end: "50%,45%"
    duration: 600
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: F01-today-she-asks
- tapOn:
    text: "Yes, live on my screen"
    retryTapIfNoChange: false
