# A first-time user: intro, "for my own care", four setup steps, first medicine.
appId: com.agastyaray.asha
---
- launchApp:
    clearState: true
# The fairy is asleep in her night room; a tap wakes her, she says hello and asks for a name.
- extendedWaitUntil:
    visible: "Wake the fairy"
    timeout: 120000
- takeScreenshot: 01-intro-asleep
- tapOn: "Wake the fairy"
# Her wake-up animation (eyes, sitting up, yawn, grin) takes about 10 seconds.
- extendedWaitUntil:
    visible: "Hello!"
    timeout: 30000
- takeScreenshot: 01-intro-hello
- tapOn: "Hello!"
- extendedWaitUntil:
    visible: "Yes, of course"
    timeout: 5000
- takeScreenshot: 01-intro-shy
- tapOn: "Yes, of course"
- extendedWaitUntil:
    visible: "Give your fairy a name"
    timeout: 5000
- takeScreenshot: 01-intro-naming
- tapOn: "Titli"
- scrollUntilVisible:
    element: "That's her name"
    centerElement: true
- tapOn: "That's her name"
- extendedWaitUntil:
    visible: "You're welcome"
    timeout: 5000
- takeScreenshot: 01-intro-loves
- tapOn: "You're welcome"
- extendedWaitUntil:
    visible: "Yes, I'd love to"
    timeout: 5000
- takeScreenshot: 01-intro-invite
- tapOn: "Yes, I'd love to"
- extendedWaitUntil:
    visible: "Welcome to my home!"
    timeout: 5000
- takeScreenshot: 02-intro-home
- tapOn: "Thank you, Titli"
- extendedWaitUntil:
    visible: "Who will use this phone?"
    timeout: 10000
- takeScreenshot: 03-role-choice
- tapOn: ".*for my own care.*"
- extendedWaitUntil:
    visible: "Getting to know you"
    timeout: 10000
- takeScreenshot: 04-setup-step1
- tapOn: "Your first name"
- inputText: "Kamla"
- hideKeyboard
- takeScreenshot: 05-setup-step1-typed
- scrollUntilVisible:
    element: "Continue"
- tapOn: "Continue"
- scrollUntilVisible:
    element: "Diabetes.*"
- tapOn: "Diabetes.*"
- scrollUntilVisible:
    element: "After a heart attack.*"
- tapOn: "After a heart attack.*"
- takeScreenshot: 06-setup-step2
- scrollUntilVisible:
    element: "Continue"
- tapOn: "Continue"
- takeScreenshot: 07-setup-step3
- tapOn: "For example 112"
- inputText: "112"
- hideKeyboard
- scrollUntilVisible:
    element: "Daughter"
- tapOn: "Daughter"
- inputText: "Daughter"
- hideKeyboard
- scrollUntilVisible:
    element: "\\+91"
- tapOn: "\\+91"
- inputText: "+919876543210"
- hideKeyboard
- tapOn:
    below: "Loved one 1"
    optional: true
- inputText: "Priya"
- hideKeyboard
- takeScreenshot: 08-setup-step3-typed
- scrollUntilVisible:
    element: "Continue"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Your medicines"
    timeout: 10000
- takeScreenshot: 09-setup-step4
- scrollUntilVisible:
    element: "Add one medicine now"
- tapOn: "Add one medicine now"
- tapOn: "Metformin"
- inputText: "Metformin"
- hideKeyboard
- scrollUntilVisible:
    element: "1 tablet, 500 mg"
- tapOn: "1 tablet, 500 mg"
- inputText: "500 mg"
- hideKeyboard
- takeScreenshot: 10-med-editor
- scrollUntilVisible:
    element: "Save this medicine"
- tapOn: "Save this medicine"
- takeScreenshot: 11-med-saved
- scrollUntilVisible:
    element: "Go to my day"
    direction: UP
- tapOn: "Go to my day"
- waitForAnimationToEnd
- takeScreenshot: 12-today-first-open
# Titli shows the person round her whole home once: Today (what is due, the big button, Help), then each room.
- extendedWaitUntil:
    visible: "Welcome to my home.*"
    timeout: 15000
- takeScreenshot: 12-tour-1-today
- tapOn:
    text: "Next"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "When it's done.*"
    timeout: 15000
- takeScreenshot: 12-tour-2-green
- tapOn:
    text: "Next"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "I'm here to take care of you.*"
    timeout: 15000
- takeScreenshot: 12-tour-3-help
- tapOn:
    text: "Next"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Come, this is your medicine room.*"
    timeout: 15000
- takeScreenshot: 12-tour-4-meds
- tapOn:
    text: "Next"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "To add a new medicine.*"
    timeout: 15000
- takeScreenshot: 12-tour-4b-meds-add
- tapOn:
    text: "Next"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Or, take a photo of your prescription.*"
    timeout: 15000
- takeScreenshot: 12-tour-4c-meds-photo
- tapOn:
    text: "Next"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Let's rest here for a moment.*"
    timeout: 15000
- takeScreenshot: 12-tour-4d-rest
- tapOn:
    text: "Next"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "This is the care room.*"
    timeout: 15000
- takeScreenshot: 12-tour-5-care
- tapOn:
    text: "Next"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "And this is where your family lives.*"
    timeout: 15000
- takeScreenshot: 12-tour-6-family
- tapOn:
    text: "Next"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "This is my favourite room.*"
    timeout: 15000
- takeScreenshot: 12-tour-7-talk
- tapOn:
    text: "Next"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Are you doing okay.*"
    timeout: 15000
- takeScreenshot: 12-tour-7b-rest
- tapOn:
    text: "Next"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Behind this little wheel.*"
    timeout: 15000
- takeScreenshot: 12-tour-8-settings
- tapOn:
    text: "Next"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "That's my whole home.*"
    timeout: 15000
- takeScreenshot: 12-tour-9-end
- tapOn: "Thank you"
- waitForAnimationToEnd
- takeScreenshot: 12-today-after-tour
