# A first-time user: intro, "for my own care", four setup steps, first medicine.
appId: com.agastyaray.asha
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Skip"
    timeout: 120000
- takeScreenshot: 01-intro-1
- scrollUntilVisible:
    element: "Next"
- tapOn: "Next"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Skip"
    timeout: 5000
- takeScreenshot: 01-intro-2
- scrollUntilVisible:
    element: "Next"
- tapOn: "Next"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Skip"
    timeout: 5000
- takeScreenshot: 01-intro-3
- scrollUntilVisible:
    element: "Next"
- tapOn: "Next"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Skip"
    timeout: 5000
- takeScreenshot: 01-intro-4
- scrollUntilVisible:
    element: "Next"
- tapOn: "Next"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Skip"
    timeout: 5000
- takeScreenshot: 01-intro-5
- scrollUntilVisible:
    element: "Next"
- tapOn: "Next"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Skip"
    timeout: 5000
- takeScreenshot: 01-intro-6
- takeScreenshot: 02-intro-last
- scrollUntilVisible:
    element: "Let's set up.*"
- tapOn: "Let's set up.*"
- extendedWaitUntil:
    visible: "Who will use this phone?"
    timeout: 10000
- takeScreenshot: 03-role-choice
- tapOn: ".*for my own care.*"
- extendedWaitUntil:
    visible: "Step 1 / 4"
    timeout: 10000
- takeScreenshot: 04-setup-step1
- tapOn: "Your first name"
- inputText: "Kamla"
- hideKeyboard
- takeScreenshot: 05-setup-step1-typed
- scrollUntilVisible:
    element: "Continue"
- tapOn: "Continue"
- scrollUntilVisible:
    element: "Diabetes.*"
- tapOn: "Diabetes.*"
- scrollUntilVisible:
    element: "After a heart attack.*"
- tapOn: "After a heart attack.*"
- takeScreenshot: 06-setup-step2
- scrollUntilVisible:
    element: "Continue"
- tapOn: "Continue"
- takeScreenshot: 07-setup-step3
- tapOn: "112"
- inputText: "112"
- hideKeyboard
- scrollUntilVisible:
    element: "Daughter"
- tapOn: "Daughter"
- inputText: "Daughter"
- hideKeyboard
- scrollUntilVisible:
    element: "\\+91"
- tapOn: "\\+91"
- inputText: "+919876543210"
- hideKeyboard
- tapOn:
    below: "Loved one 1"
    optional: true
- inputText: "Priya"
- hideKeyboard
- takeScreenshot: 08-setup-step3-typed
- scrollUntilVisible:
    element: "Continue"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Step 4 / 4"
    timeout: 10000
- takeScreenshot: 09-setup-step4
- scrollUntilVisible:
    element: "Add one medicine now"
- tapOn: "Add one medicine now"
- tapOn: "Metformin"
- inputText: "Metformin"
- hideKeyboard
- scrollUntilVisible:
    element: "1 tablet, 500 mg"
- tapOn: "1 tablet, 500 mg"
- inputText: "500 mg"
- hideKeyboard
- takeScreenshot: 10-med-editor
- scrollUntilVisible:
    element: "Save this medicine"
- tapOn: "Save this medicine"
- takeScreenshot: 11-med-saved
- scrollUntilVisible:
    element: "Go to my day"
    direction: UP
- tapOn: "Go to my day"
- waitForAnimationToEnd
- takeScreenshot: 12-today-first-open
