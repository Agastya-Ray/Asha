# Settings: switch on "Floating fairy over other apps" (the permission is already allowed, so she comes straight on).
appId: com.agastyaray.asha
---
# in the evening the fairy may ask about tomorrow in a card that covers the page; answer it first
- tapOn:
    text: "Not today"
    optional: true
# a new day can bring her "a new flower opened in my crown" card over the page
- tapOn:
    text: "It's lovely!"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
# the gear at the top right (Today also has the word "Settings" in its reminder help, so tap the gear by place)
- tapOn:
    point: "70%,9%"
- extendedWaitUntil:
    visible: ".*Fairy on my home and lock screen.*|.*Floating fairy.*|Settings"
    timeout: 10000
- scrollUntilVisible:
    element: "(?s).*Floating fairy over other apps.*"
    direction: DOWN
    visibilityPercentage: 60
    timeout: 30000
# lift it clear of the bottom tab bar, which covers the lowest part of the page
- swipe:
    start: "50%,75%"
    end: "50%,40%"
    duration: 600
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: F11b-settings-floating-toggle
- tapOn:
    text: "(?s).*Floating fairy over other apps.*"
    retryTapIfNoChange: false
- waitForAnimationToEnd
