# Settings: switch on "Floating fairy over other apps" (the permission is already allowed, so she comes straight on).
appId: com.agastyaray.asha
---
- tapOn: "Settings"
- scrollUntilVisible:
    element: ".*Floating fairy over other apps.*"
    direction: DOWN
    centerElement: true
    timeout: 20000
- takeScreenshot: F11b-settings-floating-toggle
- tapOn:
    text: ".*Floating fairy over other apps.*"
    retryTapIfNoChange: false
- waitForAnimationToEnd
