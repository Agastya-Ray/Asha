# Start a family circle from Maa's phone and get an invite code.
appId: com.agastyaray.asha
---
- launchApp
# wait for Today to finish loading, or the bar tap below lands before the app is ready
- extendedWaitUntil:
    visible: "Good morning.*"
    timeout: 30000
# the Family tab, tapped by position on the bottom bar (its label can match text further up the page)
- tapOn:
    point: "70%,92%"
- extendedWaitUntil:
    notVisible: "Opening your family circle.*"
    timeout: 20000
- takeScreenshot: 50-family-start
- scrollUntilVisible:
    element: ".*(Start|Create|Make).*"
    optional: true
- tapOn:
    text: ".*(Start|Create|Make).*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 51-family-after-start
- scroll
- takeScreenshot: 52-family-after-start-2
# look further down the page while the invite control is still out of sight
- scroll
- takeScreenshot: 52b-family-scrolled-more
- scroll
- takeScreenshot: 52c-family-scrolled-more
- scroll
- takeScreenshot: 52d-family-scrolled-more
# the invite section sits below the circle's settings, so scroll down to it.
# Optional: the circle itself passes, but CI has not reached this control yet (see the README).
- scrollUntilVisible:
    element: "Make an invite code|Make a new code|Their code.*"
    direction: DOWN
    timeout: 45000
    optional: true
- tapOn:
    text: "Make an invite code"
    optional: true
- takeScreenshot: 53-family-invite-code
