# Start a family circle from Maa's phone and get an invite code.
appId: com.agastyaray.asha
---
- launchApp
- tapOn: "Family"
- extendedWaitUntil:
    notVisible: "Opening your family circle.*"
    timeout: 20000
- takeScreenshot: 50-family-start
- scrollUntilVisible:
    element: ".*(Start|Create|Make).*"
    optional: true
- tapOn:
    text: ".*(Start|Create|Make).*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 51-family-after-start
- scroll
- takeScreenshot: 52-family-after-start-2
# the invite section sits below the circle's settings, so scroll down to it
- scrollUntilVisible:
    element: "Make an invite code|Make a new code|Their code.*"
    direction: DOWN
    timeout: 45000
- tapOn:
    text: "Make an invite code"
    optional: true
- extendedWaitUntil:
    visible: "Their code.*"
    timeout: 30000
- takeScreenshot: 53-family-invite-code
