# Start a family circle from Maa's phone and get an invite code.
appId: com.agastyaray.asha
---
- launchApp
- tapOn: "Family"
- extendedWaitUntil:
    notVisible: "Opening your family circle.*"
    timeout: 20000
- takeScreenshot: ${OUT}/50-family-start
- scrollUntilVisible:
    element: ".*(Start|Create|Make).*"
    optional: true
- tapOn:
    text: ".*(Start|Create|Make).*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/51-family-after-start
- scroll
- takeScreenshot: ${OUT}/52-family-after-start-2
