# Quiet mode: ask her to be quiet from Settings, check the banner, then wake her early.
appId: com.agastyaray.asha
---
- launchApp
- runFlow: wake_if_quiet.yaml
- tapOn: "Settings"
# centred, so the tap can't land on Titli's bubble or the tab bar at the bottom
- scrollUntilVisible:
    element: "🤫 Quiet for a while (meeting, event)"
    centerElement: true
- tapOn:
    text: "🤫 Quiet for a while (meeting, event)"
    retryTapIfNoChange: false
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "30 minutes"
    timeout: 10000
- tapOn: "30 minutes"
- takeScreenshot: 80-quiet-sheet
- tapOn:
    text: "Be quiet until.*"
- tapOn: "Today"
- assertVisible:
    text: ".*is quiet until.*"
- takeScreenshot: 81-quiet-banner
# the banner opens the sheet, which can wake her too. Android's WebView leaves that sheet out of the
# accessibility tree Maestro reads when it opens over Today while she is quiet (runs 108, 114, 115: the sheet
# is on screen, focus and a scroll don't bring it in), so the sheet is checked by screenshot, closed by tapping
# the dimmed page above it, and she is woken with the banner's own "Wake her" button.
- tapOn:
    text: "🤫.*is quiet until.*"
    retryTapIfNoChange: false
- waitForAnimationToEnd
- takeScreenshot: 82-quiet-sheet-from-banner
- tapOn:
    point: "50%,20%"
- waitForAnimationToEnd
- assertVisible:
    text: ".*is quiet until.*"
- tapOn: "Wake her"
- waitForAnimationToEnd
- assertNotVisible:
    text: ".*is quiet until.*"
- takeScreenshot: 82-quiet-woken
