# Walk every tab like a user would, scrolling each.
appId: com.agastyaray.asha
---
- launchApp
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/30-today-top
- scroll
- takeScreenshot: ${OUT}/31-today-scrolled
- tapOn: "Meds"
- takeScreenshot: ${OUT}/32-meds
- tapOn: "Care"
- takeScreenshot: ${OUT}/33-care-top
- tapOn: "Okay"
- tapOn: "Fasting sugar"
- tapOn:
    below: "Fasting sugar"
    optional: true
- inputText: "132"
- hideKeyboard
- scroll
- takeScreenshot: ${OUT}/34-care-checkin
- scroll
- takeScreenshot: ${OUT}/35-care-chart
- scroll
- takeScreenshot: ${OUT}/36-care-plate
- tapOn: "Family"
- extendedWaitUntil:
    notVisible: "Opening your family circle.*"
    timeout: 20000
- takeScreenshot: ${OUT}/37-family
- scroll
- takeScreenshot: ${OUT}/38-family-scrolled
- tapOn: "Talk"
- takeScreenshot: ${OUT}/39-talk
- tapOn:
    text: "Turn on Pro on this phone"
    optional: true
- tapOn: "Or type here"
- inputText: "Hello Asha. My knees hurt a little today."
- hideKeyboard
- tapOn: "Send"
- extendedWaitUntil:
    notVisible: "Asha is thinking.*"
    timeout: 40000
- takeScreenshot: ${OUT}/40-talk-reply
- tapOn: "Settings"
- takeScreenshot: ${OUT}/41-settings
- scroll
- takeScreenshot: ${OUT}/42-settings-2
- scroll
- takeScreenshot: ${OUT}/43-settings-3
- scroll
- takeScreenshot: ${OUT}/44-settings-4
