# Builds the Asha Android app on GitHub's computers every time code is pushed.
# Result: an installable Asha.apk (Releases page + the run's "Artifacts").
# If the 4 signing secrets are added (see README), it also builds the Play Store file (.aab).
name: Build Android app

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_API_BASE: ${{ vars.ASHA_API_BASE }}
      VITE_ASHA_APP_KEY: ${{ secrets.ASHA_APP_KEY }}
      ASHA_VERSION_CODE: ${{ github.run_number }}
      ASHA_VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEY: ${{ secrets.ASHA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: scripts/ci-step.sh Install npm install --no-audit --no-fund

      - name: Check the code for mistakes
        run: scripts/ci-step.sh Typecheck npm run typecheck

      - name: Build the screens
        run: scripts/ci-step.sh "Web build" npm run build

      - name: Publish built screens to the web-preview branch (for testing)
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        run: |
          cd dist
          # Built files only, nothing for Vercel to build: tell it to skip this branch
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b web-preview
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "web build ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" web-preview

      - name: Create the Android project
        run: scripts/ci-step.sh "cap add" npx cap add android

      - name: App icon and splash
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --assetPath assets --iconBackgroundColor '#1D6B45' --splashBackgroundColor '#F3EEE4'

      - name: Add Asha's native code (voice, alarms, help)
        run: scripts/ci-step.sh "Prepare android" node scripts/prepare-android.mjs

      - name: Copy screens into the app
        run: scripts/ci-step.sh "cap sync" npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ../scripts/ci-step.sh "Gradle APK" ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Asha.apk

      - name: Check the app meets Google Play's target level (Android 16, API 36)
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump badging Asha.apk | grep -E "^package:|targetSdkVersion"
          T=$("$AAPT" dump badging Asha.apk | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")
          if [ "${T:-0}" -lt 36 ]; then echo "::error title=Google Play::targetSdk is $T, Play needs 36"; exit 1; fi

      - name: Check Firebase is inside the app
        run: |
          if unzip -p Asha.apk resources.arsc | grep -aq google_app_id; then
            echo "::notice title=Firebase::Firebase is built into this APK (instant family messages ON)"
          else
            echo "::warning title=Firebase::Firebase NOT found in this APK (family messages will use the 15-minute check)"
          fi

      - name: Build Play Store bundle (only if signing secrets exist)
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: android
        env:
          ASHA_KEYSTORE_PASSWORD: ${{ secrets.ASHA_KEYSTORE_PASSWORD }}
          ASHA_KEY_ALIAS: ${{ secrets.ASHA_KEY_ALIAS }}
          ASHA_KEY_PASSWORD: ${{ secrets.ASHA_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ASHA_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ASHA_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ../scripts/ci-step.sh "Gradle AAB" ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../Asha-play.aab

      - name: Keep the files with this run
        uses: actions/upload-artifact@v4
        with:
          name: asha-android-${{ github.run_number }}
          path: |
            Asha.apk
            Asha-play.aab
          if-no-files-found: warn

      - name: Put a test APK on its own page (other branches)
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.ref_name }}
          name: "TEST build: ${{ github.ref_name }}"
          prerelease: true
          make_latest: false
          body: |
            Test build of branch `${{ github.ref_name }}`, version 1.0.${{ github.run_number }} (commit ${{ github.sha }}).
            Not the official version yet. On your Android phone: tap **Asha.apk** below to install it over the current app (your data stays).
          files: Asha.apk

      - name: Put the APK on the Releases page (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Asha (latest test build)
          make_latest: true
          body: |
            Latest Asha test build, version 1.0.${{ github.run_number }}, from commit ${{ github.sha }}.
            On your Android phone: tap **Asha.apk** below, download, open, allow "install unknown apps" once.
          files: Asha.apk
