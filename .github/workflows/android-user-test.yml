# Installs Asha on an Android emulator and walks through it like a user, taking screenshots.
# Results: the run's artifacts, and the android-test-results branch.
name: Android user test

on:
  push:
    branches: ["claude/android-user-test"]
  workflow_dispatch:
    inputs:
      api:
        description: "Android API level of the emulator (23 = Android 6, the oldest Asha supports)"
        default: "34"
      gpu:
        description: "Emulator GPU mode (swiftshader_indirect, or guest to render inside the emulator)"
        default: "swiftshader_indirect"

permissions:
  contents: write

jobs:
  user-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITE_API_BASE: ${{ vars.ASHA_API_BASE }}
      VITE_ASHA_APP_KEY: ${{ secrets.ASHA_APP_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build the APK (same steps as the main build)
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap add android
          npx --yes @capacitor/assets@3 generate --android --assetPath assets --iconBackgroundColor '#1D6B45' --splashBackgroundColor '#F3EEE4' || true
          node scripts/prepare-android.mjs
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk ../Asha.apk
      - name: Install ImageMagick (makes the prescription photo for the gallery test)
        run: sudo apt-get update -q && sudo apt-get install -y -q imagemagick fonts-dejavu-core
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the user test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api || '34' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu ${{ inputs.gpu || 'swiftshader_indirect' }} -noaudio -no-boot-anim -camera-back none
          script: OUT=$PWD/results APK=$PWD/Asha.apk bash tests/android/run.sh
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-user-test-${{ github.run_number }}
          path: results
      - name: Publish results to the android-test-results branch
        if: always()
        run: |
          mkdir -p /tmp/pub && cp -r results "/tmp/pub/run-${{ github.run_number }}" && echo "api ${{ inputs.api || '34' }}" > "/tmp/pub/run-${{ github.run_number }}/API.txt"
          cd /tmp/pub
          git init -q -b android-test-results
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin android-test-results && git reset -q FETCH_HEAD || true
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add "run-${{ github.run_number }}"
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "user test run ${{ github.run_number }}"
          git push -q origin android-test-results
